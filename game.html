<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ведьма на коте</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0015;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    touch-action: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: 100dvh;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 12px 18px;
    pointer-events: none;
    z-index: 10;
  }
  .score-box {
    color: #d4aaff;
    font-size: 20px;
    text-shadow: 0 0 10px #9b59b6;
    letter-spacing: 2px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,0,20,0.85);
    z-index: 20;
    color: #d4aaff;
    text-align: center;
    gap: 18px;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(28px, 8vw, 52px);
    text-shadow: 0 0 20px #9b59b6, 0 0 40px #6c3483;
    line-height: 1.2;
  }
  #overlay p {
    font-size: clamp(14px, 4vw, 20px);
    color: #b39ddb;
    max-width: 360px;
    line-height: 1.6;
  }
  #startBtn {
    padding: 14px 40px;
    font-size: clamp(16px, 4.5vw, 22px);
    background: linear-gradient(135deg, #6c3483, #9b59b6);
    border: 2px solid #d4aaff;
    color: #fff;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px #9b59b6;
    font-family: inherit;
    letter-spacing: 1px;
    transition: transform .15s, box-shadow .15s;
  }
  #startBtn:active { transform: scale(0.95); }
  #finalScore { font-size: clamp(18px,5vw,26px); color: #f8c8ff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="ui">
  <div class="score-box">⭐ <span id="scoreDisplay">0</span></div>
  <div class="score-box">🏆 <span id="bestDisplay">0</span></div>
</div>

<canvas id="c"></canvas>

<div id="overlay">
  <h1>🌙 Ведьма<br>на коте</h1>
  <p>Помоги рыжей ведьме мчаться сквозь ночное небо верхом на чёрном коте!</p>
  <p style="font-size:clamp(12px,3.5vw,16px);color:#9b7fcc;">Нажми / коснись — прыжок<br>Двойное нажатие — двойной прыжок</p>
  <button id="startBtn">Полетели! ✨</button>
  <div id="finalScore" class="hidden"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreDisplay');
const bestEl = document.getElementById('bestDisplay');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const finalScoreEl = document.getElementById('finalScore');

// ─── Responsive sizing ───────────────────────────────────────────
const W = 480, H = 280;
canvas.width = W;
canvas.height = H;
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ─── Stars ───────────────────────────────────────────────────────
const STARS = Array.from({length: 80}, () => ({
  x: Math.random() * W,
  y: Math.random() * H * 0.7,
  r: Math.random() * 1.5 + 0.3,
  twinkle: Math.random() * Math.PI * 2,
  speed: Math.random() * 0.3 + 0.05
}));

// ─── Constants ───────────────────────────────────────────────────
const GROUND_Y = H - 48;
const GRAVITY  = 0.55;
const JUMP_V   = -11;
const BASE_SPEED = 4;

// ─── Game state ──────────────────────────────────────────────────
let state, score, best = 0, speed, frame, obstacles, particles, bgX, moonPhase;

function initGame() {
  state    = 'playing';
  score    = 0;
  speed    = BASE_SPEED;
  frame    = 0;
  bgX      = 0;
  moonPhase = 0;
  obstacles = [];
  particles = [];

  player.x     = 80;
  player.y     = GROUND_Y - 42;
  player.vy    = 0;
  player.jumps = 0;
  player.onGround = true;
  player.legPhase = 0;
  player.tailPhase = 0;
}

// ─── Player (cat + rider) ────────────────────────────────────────
const player = { x:80, y:0, vy:0, jumps:0, onGround:true, legPhase:0, tailPhase:0, w:52, h:42 };

function jump() {
  if (state !== 'playing') return;
  if (player.jumps < 2) {
    player.vy = player.jumps === 0 ? JUMP_V : JUMP_V * 0.82;
    player.jumps++;
    player.onGround = false;
    spawnParticles(player.x + 26, player.y + 40, '#d4aaff', 6);
  }
}

// ─── Drawing helpers ─────────────────────────────────────────────
function arc(x,y,rx,ry,c,stroke) {
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle = c;
  ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth=1; ctx.stroke(); }
}

// Draw black cat
function drawCat(x, y, legPh, tailPh) {
  const CAT_COLOR = '#111';
  const CAT_SHINE = '#2a2a2a';

  // tail (behind)
  const tWag = Math.sin(tailPh) * 8;
  ctx.beginPath();
  ctx.moveTo(x+4, y+22);
  ctx.quadraticCurveTo(x-10, y+14+tWag, x-14, y+4+tWag);
  ctx.strokeStyle = CAT_COLOR;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.stroke();
  // tail tip
  arc(x-14, y+4+tWag, 4, 3.5, CAT_COLOR);

  // body
  ctx.beginPath();
  ctx.ellipse(x+18, y+20, 20, 11, 0, 0, Math.PI*2);
  ctx.fillStyle = CAT_COLOR;
  ctx.fill();

  // legs (4 legs animated)
  const offsets = [
    Math.sin(legPh)*5,
    Math.sin(legPh+1)*5,
    Math.sin(legPh+2)*5,
    Math.sin(legPh+3)*5
  ];
  const legXs = [x+6, x+12, x+24, x+30];
  legXs.forEach((lx, i) => {
    ctx.beginPath();
    ctx.moveTo(lx, y+28);
    ctx.lineTo(lx+offsets[i]*0.4, y+36);
    ctx.strokeStyle = CAT_COLOR;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    // paw
    arc(lx+offsets[i]*0.4, y+37, 3, 2, CAT_COLOR);
  });

  // head
  arc(x+34, y+12, 10, 9, CAT_COLOR);

  // ears
  ctx.beginPath();
  ctx.moveTo(x+26, y+5);
  ctx.lineTo(x+30, y-3);
  ctx.lineTo(x+34, y+5);
  ctx.fillStyle = CAT_COLOR;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+36, y+5);
  ctx.lineTo(x+40, y-2);
  ctx.lineTo(x+44, y+5);
  ctx.fill();

  // inner ear
  ctx.beginPath();
  ctx.moveTo(x+28, y+4);
  ctx.lineTo(x+30, y-1);
  ctx.lineTo(x+33, y+4);
  ctx.fillStyle = '#3a0020';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+37, y+4);
  ctx.lineTo(x+40, y-1);
  ctx.lineTo(x+43, y+4);
  ctx.fill();

  // eyes (glowing green)
  arc(x+31, y+12, 2.5, 2.5, '#00ff88');
  arc(x+37, y+12, 2.5, 2.5, '#00ff88');
  arc(x+31, y+12, 1.2, 1.5, '#003322');
  arc(x+37, y+12, 1.2, 1.5, '#003322');
  // eye glow
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur  = 6;
  arc(x+31, y+12, 2.5, 2.5, 'transparent');
  arc(x+37, y+12, 2.5, 2.5, 'transparent');
  ctx.shadowBlur = 0;

  // nose
  arc(x+34, y+15, 1.5, 1, '#ff88aa');

  // whiskers
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 0.8;
  [[x+22,y+15,x+29,y+14],[x+22,y+16,x+29,y+16],[x+22,y+17,x+29,y+18],
   [x+46,y+15,x+39,y+14],[x+46,y+16,x+39,y+16],[x+46,y+17,x+39,y+18]
  ].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });

  // shine on body
  arc(x+22, y+16, 5, 3, 'rgba(255,255,255,0.07)');
}

// Draw rider (red-haired girl)
function drawRider(x, y, frame) {
  const bobY = Math.sin(frame * 0.15) * 1.5;
  const ry = y - 28 + bobY; // rider sits on cat

  // hair (back, behind body)
  ctx.beginPath();
  ctx.moveTo(x+22, ry+6);
  ctx.quadraticCurveTo(x+14, ry+22, x+15, ry+36);
  ctx.quadraticCurveTo(x+18, ry+40, x+22, ry+36);
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#c0392b';
  ctx.lineCap = 'round';
  ctx.stroke();

  // lavender shirt / body
  ctx.beginPath();
  ctx.ellipse(x+26, ry+24, 8, 11, 0, 0, Math.PI*2);
  ctx.fillStyle = '#9b8ec4';
  ctx.fill();

  // black inner top (tank top)
  ctx.beginPath();
  ctx.ellipse(x+26, ry+22, 5, 8, 0, 0, Math.PI*2);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();

  // arms (slightly animated)
  const armSway = Math.sin(frame*0.15)*2;
  // left arm
  ctx.beginPath();
  ctx.moveTo(x+18, ry+20);
  ctx.quadraticCurveTo(x+12+armSway, ry+28, x+14+armSway, ry+34);
  ctx.strokeStyle = '#d4a896';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.stroke();
  // right arm
  ctx.beginPath();
  ctx.moveTo(x+34, ry+20);
  ctx.quadraticCurveTo(x+40-armSway, ry+28, x+38-armSway, ry+34);
  ctx.stroke();

  // neck
  arc(x+26, ry+13, 3, 4, '#d4a896');

  // necklace
  ctx.beginPath();
  ctx.arc(x+26, ry+16, 5, 0.3, Math.PI-0.3);
  ctx.strokeStyle = '#aaaaaa';
  ctx.lineWidth = 1;
  ctx.stroke();
  // pendant
  ctx.beginPath();
  ctx.moveTo(x+26, ry+21);
  ctx.lineTo(x+24, ry+25);
  ctx.lineTo(x+28, ry+25);
  ctx.closePath();
  ctx.fillStyle = '#6aaa6a';
  ctx.fill();

  // head
  arc(x+26, ry+6, 9, 10, '#d4a896');

  // hair (front)
  ctx.beginPath();
  ctx.moveTo(x+17, ry+4);
  ctx.quadraticCurveTo(x+18, ry-4, x+26, ry-5);
  ctx.quadraticCurveTo(x+34, ry-4, x+35, ry+4);
  ctx.quadraticCurveTo(x+34, ry+2, x+33, ry+8);
  ctx.lineTo(x+19, ry+8);
  ctx.closePath();
  ctx.fillStyle = '#c0392b';
  ctx.fill();

  // sunglasses on head
  ctx.beginPath();
  ctx.ellipse(x+22, ry-3, 4, 2.5, -0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,180,200,0.5)';
  ctx.fill();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(x+30, ry-3, 4, 2.5, 0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(200,180,255,0.5)';
  ctx.fill();
  ctx.strokeStyle = '#888';
  ctx.stroke();
  // bridge
  ctx.beginPath();
  ctx.moveTo(x+26, ry-3);
  ctx.lineTo(x+26.5, ry-3);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // face features
  // eyebrows
  ctx.beginPath();
  ctx.moveTo(x+20, ry+4);
  ctx.lineTo(x+24, ry+3);
  ctx.strokeStyle = '#8b3a2a';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+28, ry+3);
  ctx.lineTo(x+32, ry+4);
  ctx.stroke();

  // eyes (purple/blue eyeshadow)
  arc(x+22, ry+6, 3.5, 2.5, '#2d1b5e');
  arc(x+22, ry+6, 2, 1.8, '#fff');
  arc(x+22.5, ry+6.2, 1.2, 1.2, '#1a0a3a');
  // eyeshadow
  ctx.beginPath();
  ctx.ellipse(x+22, ry+5.5, 4.5, 2, -0.1, Math.PI, Math.PI*2);
  ctx.fillStyle = 'rgba(100,60,200,0.35)';
  ctx.fill();

  arc(x+30, ry+6, 3.5, 2.5, '#2d1b5e');
  arc(x+30, ry+6, 2, 1.8, '#fff');
  arc(x+30.5, ry+6.2, 1.2, 1.2, '#1a0a3a');
  ctx.beginPath();
  ctx.ellipse(x+30, ry+5.5, 4.5, 2, 0.1, Math.PI, Math.PI*2);
  ctx.fillStyle = 'rgba(100,60,200,0.35)';
  ctx.fill();

  // eyelashes
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  [-5,-3,-1,1].forEach(dx=>{
    ctx.beginPath(); ctx.moveTo(x+22+dx, ry+4); ctx.lineTo(x+22+dx*1.3, ry+2.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+30+dx, ry+4); ctx.lineTo(x+30+dx*1.3, ry+2.5); ctx.stroke();
  });

  // nose
  arc(x+26, ry+9, 1.5, 1, '#c4856e');

  // lips
  ctx.beginPath();
  ctx.moveTo(x+22, ry+12);
  ctx.quadraticCurveTo(x+26, ry+15, x+30, ry+12);
  ctx.quadraticCurveTo(x+26, ry+14, x+22, ry+12);
  ctx.fillStyle = '#c0392b';
  ctx.fill();

  // magic sparkle in hand
  const spark = Math.sin(frame*0.2) * 0.5 + 0.5;
  ctx.shadowColor = '#d4aaff';
  ctx.shadowBlur = 8 * spark;
  arc(x+38-armSway, ry+34, 3*spark+1, 3*spark+1, `rgba(212,170,255,${0.5+spark*0.5})`);
  ctx.shadowBlur = 0;
}

// ─── Obstacles ───────────────────────────────────────────────────
function spawnObstacle() {
  const types = ['bat','ghost','star_cluster'];
  const type = types[Math.floor(Math.random() * types.length)];
  let h, yOff = 0;
  if (type === 'bat')         { h = 22; yOff = 0; }
  else if (type === 'ghost')  { h = 32; yOff = 0; }
  else                        { h = 18; yOff = -30 - Math.random()*20; }
  obstacles.push({
    x: W + 20,
    y: GROUND_Y - h + yOff,
    w: 28, h,
    type,
    phase: Math.random() * Math.PI * 2
  });
}

function drawBat(x, y, ph) {
  const flap = Math.sin(ph) * 8;
  ctx.fillStyle = '#5a0080';
  // body
  arc(x+14, y+14, 6, 5, '#2a0040');
  // wings
  ctx.beginPath();
  ctx.moveTo(x+10, y+14);
  ctx.quadraticCurveTo(x+2, y+6+flap, x-4, y+12+flap);
  ctx.quadraticCurveTo(x+2, y+16+flap, x+10, y+16);
  ctx.fillStyle = '#3a0060';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+18, y+14);
  ctx.quadraticCurveTo(x+26, y+6+flap, x+32, y+12+flap);
  ctx.quadraticCurveTo(x+26, y+16+flap, x+18, y+16);
  ctx.fill();
  // eyes
  arc(x+12, y+13, 2, 2, '#ff0066');
  arc(x+16, y+13, 2, 2, '#ff0066');
}

function drawGhost(x, y, ph) {
  const bob = Math.sin(ph*0.7) * 3;
  const ghostY = y + bob;
  // glow
  const grad = ctx.createRadialGradient(x+14, ghostY+14, 2, x+14, ghostY+14, 22);
  grad.addColorStop(0, 'rgba(180,140,255,0.4)');
  grad.addColorStop(1, 'rgba(180,140,255,0)');
  ctx.beginPath();
  ctx.arc(x+14, ghostY+14, 22, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  // body
  ctx.beginPath();
  ctx.arc(x+14, ghostY+10, 12, Math.PI, 0);
  ctx.lineTo(x+26, ghostY+28);
  ctx.quadraticCurveTo(x+22, ghostY+22, x+18, ghostY+28);
  ctx.quadraticCurveTo(x+14, ghostY+22, x+10, ghostY+28);
  ctx.quadraticCurveTo(x+6,  ghostY+22, x+2,  ghostY+28);
  ctx.lineTo(x+2, ghostY+10);
  ctx.fillStyle = 'rgba(200,160,255,0.75)';
  ctx.fill();
  // eyes
  arc(x+10, ghostY+10, 3, 3.5, '#1a0040');
  arc(x+18, ghostY+10, 3, 3.5, '#1a0040');
  arc(x+10, ghostY+10, 1.5, 2, '#fff');
  arc(x+18, ghostY+10, 1.5, 2, '#fff');
}

function drawStarCluster(x, y, ph) {
  const cols = ['#fff','#ffe0ff','#d4aaff','#ffee99'];
  for (let i=0; i<5; i++) {
    const sx = x + [0,12,24,6,18][i];
    const sy = y + [8,0,6,16,14][i];
    const s  = (Math.sin(ph + i) * 0.4 + 0.9) * 4;
    ctx.fillStyle = cols[i%cols.length];
    ctx.shadowColor = cols[i%cols.length];
    ctx.shadowBlur  = 6;
    ctx.beginPath();
    ctx.arc(sx, sy, s, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ─── Particles ───────────────────────────────────────────────────
function spawnParticles(x, y, color, n=8) {
  for (let i=0; i<n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*4,
      vy: (Math.random()-1.5)*3,
      life: 1, decay: Math.random()*0.04+0.03,
      color, size: Math.random()*3+1
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    p.life -= p.decay;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur  = 0;
  });
  ctx.globalAlpha = 1;
}

// ─── Background ──────────────────────────────────────────────────
function drawBackground() {
  // sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,   '#05001a');
  sky.addColorStop(0.6, '#0d0030');
  sky.addColorStop(1,   '#1a0050');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // stars
  STARS.forEach(s => {
    s.x -= s.speed;
    if (s.x < 0) { s.x = W; s.y = Math.random()*H*0.7; }
    s.twinkle += 0.04;
    const alpha = 0.4 + Math.sin(s.twinkle)*0.5;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#d4aaff';
    ctx.shadowBlur  = s.r * 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1;

  // moon
  moonPhase += 0.003;
  const mx = W*0.82, my = H*0.18;
  ctx.shadowColor = '#fffacc';
  ctx.shadowBlur  = 30;
  arc(mx, my, 22, 22, '#fffacc');
  // crater shading
  arc(mx+6,  my-6,  4, 4, 'rgba(200,190,100,0.25)');
  arc(mx-8,  my+5,  3, 3, 'rgba(200,190,100,0.2)');
  ctx.shadowBlur = 0;

  // far mountains
  ctx.fillStyle = '#0a0028';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y - 10);
  [0,60,120,180,240,300,360,420,480].forEach((bx,i) => {
    const h2 = [30,50,20,45,35,55,25,40,30][i];
    ctx.lineTo(bx, GROUND_Y - 10 - h2);
    if (i<8) ctx.lineTo(bx+30, GROUND_Y - 10 - h2*0.4);
  });
  ctx.lineTo(W, GROUND_Y-10);
  ctx.lineTo(W,H); ctx.lineTo(0,H);
  ctx.fill();

  // ground
  const gr = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gr.addColorStop(0, '#1a0050');
  gr.addColorStop(1, '#0a0030');
  ctx.fillStyle = gr;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // ground glow line
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.strokeStyle = '#6a0080';
  ctx.lineWidth   = 2;
  ctx.shadowColor = '#9b59b6';
  ctx.shadowBlur  = 8;
  ctx.stroke();
  ctx.shadowBlur  = 0;
}

// ─── Collision ───────────────────────────────────────────────────
function checkCollision(obs) {
  const px = player.x + 8, pw = player.w - 16;
  const py = player.y + 10, ph = player.h - 10;
  return px < obs.x + obs.w - 4 &&
         px + pw > obs.x + 4    &&
         py < obs.y + obs.h - 4 &&
         py + ph > obs.y + 4;
}

// ─── Main loop ───────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime)/16.67, 3);
  lastTime = ts;

  drawBackground();

  if (state === 'playing') {
    frame++;

    // score & speed
    score++;
    speed = BASE_SPEED + Math.floor(score/400)*0.4;
    scoreEl.textContent = Math.floor(score/10);

    // spawn obstacles
    const minGap = Math.max(60, 120 - Math.floor(score/800)*10);
    if (obstacles.length === 0 ||
        obstacles[obstacles.length-1].x < W - (minGap + Math.random()*140)) {
      if (Math.random() < 0.015) spawnObstacle();
    }

    // update player
    player.vy += GRAVITY;
    player.y  += player.vy;
    if (player.y >= GROUND_Y - player.h) {
      player.y     = GROUND_Y - player.h;
      player.vy    = 0;
      player.jumps = 0;
      player.onGround = true;
    }
    player.legPhase  += 0.22;
    player.tailPhase += 0.08;

    // draw trail
    for (let i=0; i<3; i++) {
      ctx.globalAlpha = 0.08 * (3-i);
      drawCat(player.x - i*8, player.y, player.legPhase - i*0.3, player.tailPhase);
      ctx.globalAlpha = 1;
    }

    // draw cat + rider
    drawCat(player.x, player.y, player.legPhase, player.tailPhase);
    drawRider(player.x, player.y, frame);

    // update + draw obstacles
    obstacles.forEach(obs => {
      obs.x -= speed;
      obs.phase += 0.08;
      if (obs.type === 'bat')         drawBat(obs.x, obs.y, obs.phase);
      else if (obs.type === 'ghost')  drawGhost(obs.x, obs.y, obs.phase);
      else                            drawStarCluster(obs.x, obs.y, obs.phase);

      if (checkCollision(obs)) {
        state = 'dead';
        if (score/10 > best) best = Math.floor(score/10);
        bestEl.textContent = best;
        spawnParticles(player.x+26, player.y+20, '#ff6666', 20);
        showGameOver();
      }
    });
    obstacles = obstacles.filter(o => o.x > -60);

    // random sparkle trail while running
    if (frame % 6 === 0) {
      spawnParticles(player.x+4, player.y+player.h-5, '#9b59b6', 2);
    }
  } else if (state === 'dead') {
    // still animate
    drawCat(player.x, player.y, frame*0.1, frame*0.05);
    drawRider(player.x, player.y, frame++);
  }

  updateParticles();
  requestAnimationFrame(loop);
}

function showGameOver() {
  finalScoreEl.textContent = `Счёт: ${Math.floor(score/10)}  |  Рекорд: ${best}`;
  finalScoreEl.classList.remove('hidden');
  startBtn.textContent = 'Ещё раз! ✨';
  overlay.classList.remove('hidden');
}

// ─── Controls ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});

let lastTap = 0;
function handleTouch(e) {
  e.preventDefault();
  jump();
}
canvas.addEventListener('touchstart', handleTouch, { passive: false });
document.addEventListener('touchstart', handleTouch, { passive: false });
document.addEventListener('mousedown', () => jump());

startBtn.addEventListener('click', e => {
  e.stopPropagation();
  overlay.classList.add('hidden');
  finalScoreEl.classList.add('hidden');
  initGame();
});

// ─── Kick off ────────────────────────────────────────────────────
initGame();
state = 'waiting';
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
